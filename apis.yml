aid: nanotronics
name: Nanotronics
description: 'Nanotronics (rebranded to CubeFabs in 2025) builds AI-driven inspection, process-control,
  and automation systems for advanced industrial manufacturing, with a focus on semiconductors, data
  centers, EV/automotive, and aerospace/defense. Its "AI factory" platform combines optical imaging,
  machine learning, and robotics to improve manufacturing precision, yields, and cost efficiency for
  customers including Hologic, Broadcom, Coherent, and Standard BioTools. Surfaced as a founders-fund
  portfolio company; no public developer/API surface was found during enrichment.'
